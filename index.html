<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <title>ShrineBeasts Fursona Colour Swapper</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }

    h1 { 
	color: #2ecc71; 
	text-align: center;
	font-family: "Roboto Condensed", system-ui, sans-serif;
	}
    
    .container {
      display: grid;
      grid-template-columns: 355px 1fr;
      gap: 20px;
    }
    
    .controls {
      background: #16213e;
      padding: 20px;
      border-radius: 12px;
    }
    
    .upload-zone {
      border: 2px dashed #4a5568;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-zone:hover { border-color: #ff6b6b; }
    .upload-zone input { display: none; }
    
    .color-mappings {
      text-align: center;
      margin-top: 20px;
    }
    
    .mapping {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px;
      background: #1a1a2e;
      border-radius: 8px;
      flex-wrap: wrap;
    }
    
    .mapping input[type="color"] {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .mapping input[type="text"] {
      width: 70px;
      padding: 8px;
      border: 1px solid #4a5568;
      border-radius: 4px;
      background: #0f0f23;
      color: #eee;
      font-family: monospace;
    }
    
    .arrow { color: #ff6b6b; font-weight: bold; }
    
    .remove-btn {
      margin-left: auto;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }
    
    .add-btn, .apply-btn, .download-btn, .reset-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .add-btn:hover, .apply-btn:hover, .download-btn:hover, .reset-btn:hover {
      transform: scale(1.05);
    }
    

    .add-btn { background: #3498db; color: white; }
    .apply-btn { background: #2ecc71; color: white; font-size: 20px; }
    .download-btn { background: #95a5a6; color: white; }
    .reset-btn { background: #ff6b6b; color: white; }
    
    .tolerance-control {
      text-align: center;
      margin-top: 15px;
    }
    .tolerance-control label {
      display: block;
      margin-bottom: 5px;
    }
    .tolerance-control input[type="range"] {
      width: 100%;
    }
    
	/* tolerance buttons + number input styling */
	.tolerance-row {
	  display: flex;
	  gap: 8px;
	  align-items: center;
	}

	.tolerance-btn {
	  background: #2d3748;
	  color: #eee;
	  border: 1px solid #4a5568;
	  border-radius: 6px;
	  padding: 6px 12px;
	  font-size: 16px;
	  cursor: pointer;
	  transition: background 0.15s, transform 0.05s;
	}

	.tolerance-btn:hover {
	  background: #4a5568;
	}

	.tolerance-btn:active {
	  transform: scale(1.05);
	}

	#toleranceNumber {
	  background: #0f0f23;
	  color: #eee;
	  border: 1px solid #4a5568;
	  border-radius: 6px;
	  padding: 6px 8px;
	  font-family: monospace;
	  width: 70px;
	}

	/* remove ugly browser arrows in number input */
	#toleranceNumber::-webkit-outer-spin-button,
	#toleranceNumber::-webkit-inner-spin-button {
	  -webkit-appearance: none;
	  margin: 0;
	}
	#toleranceNumber {
	  -moz-appearance: textfield;
	}

    .canvas-container {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    canvas {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .placeholder {
      color: #4a5568;
      font-size: 18px;
    }

    .presets {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #4a5568;
    }

    .presets h3 { 
	margin: 0 0 10px 0; 
	font-size: 14px; 
	}

    .preset-btn {
      background: #2d3748;
      color: #eee;
      border: none;
      padding: 8px 12px;
      margin: 2px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .preset-btn:hover { background: #4a5568; }
  </style>
</head>
<body>
  <h1>🐉ShrineBeasts Fursona Colour Swapper v1🐉</h1>
  
  <div class="container">
    <div class="controls">
      <div class="upload-zone" id="uploadZone">
        <p>📁 Click or drag to upload refsheet</p>
        <input type="file" id="fileInput" accept="image/*">
	<small>For best results, use a high resolution PNG refsheet, with no shading and a transparent background.</small>
      </div>
      
      <div class="color-mappings">
        <h3>Colour Mappings</h3>
        <div id="mappingsList"></div>
        <button class="add-btn" id="addMapping">+ Add Color Mapping</button>
      </div>
      
	<div class="tolerance-control">
	  <label>
	    Colour Tolerance:
	    <span id="toleranceValue">3</span>
	  </label>

	  <div class="tolerance-row">
	    <button id="tolMinus" class="tolerance-btn">−</button>
	    <input type="range" id="tolerance" min="1" max="100" value="3">
	    <button id="tolPlus" class="tolerance-btn">+</button>
	    <input type="number" id="toleranceNumber" min="1" max="100" value="3">
	  </div>

	  <small>Higher Tolerance = more general matching</small>
	</div>
      
      <button class="apply-btn" id="applyColors">🔄 Apply Colour Swap</button>
      <button class="reset-btn" id="resetImage">↩️ Reset to Original</button>
      <button class="download-btn" id="downloadImage">💾 Download Result</button>

    </div>
    
    <div class="canvas-container">
      <canvas id="canvas" style="display: none;"></canvas>
      <p class="placeholder" id="placeholder">Upload your ref sheet on the left</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const mappingsList = document.getElementById('mappingsList');
    const toleranceSlider = document.getElementById('tolerance');
    const toleranceValue = document.getElementById('toleranceValue');
    const toleranceNumber = document.getElementById('toleranceNumber');
    const placeholder = document.getElementById('placeholder');
    const tolMinus = document.getElementById('tolMinus');
    const tolPlus = document.getElementById('tolPlus');
    
    let originalImageData = null;
    let originalImage = null;

    // File upload handling
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = '#ff6b6b';
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.style.borderColor = '#4a5568';
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = '#4a5568';
      if (e.dataTransfer.files[0]) {
        loadImage(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadImage(e.target.files[0]);
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'block';
          placeholder.style.display = 'none';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Color mapping management
    function addColorMapping(fromColor = '#0000FF', toColor = '#FF0000') {
      const div = document.createElement('div');
      div.className = 'mapping';
      div.innerHTML = `
        <input type="color" class="from-color" value="${fromColor}">
        <input type="text" class="from-hex" value="${fromColor}" maxlength="7">
        <span class="arrow">→</span>
        <input type="color" class="to-color" value="${toColor}">
        <input type="text" class="to-hex" value="${toColor}" maxlength="7">
        <button class="remove-btn">×</button>
      `;
      
      // Sync color picker and text input
      const fromColorPicker = div.querySelector('.from-color');
      const fromHex = div.querySelector('.from-hex');
      const toColorPicker = div.querySelector('.to-color');
      const toHex = div.querySelector('.to-hex');
      
      fromColorPicker.addEventListener('input', () => fromHex.value = fromColorPicker.value);
      fromHex.addEventListener('input', () => {
        if (/^#[0-9A-Fa-f]{6}$/.test(fromHex.value)) {
          fromColorPicker.value = fromHex.value;
        }
      });
      toColorPicker.addEventListener('input', () => toHex.value = toColorPicker.value);
      toHex.addEventListener('input', () => {
        if (/^#[0-9A-Fa-f]{6}$/.test(toHex.value)) {
          toColorPicker.value = toHex.value;
        }
      });
      
      div.querySelector('.remove-btn').addEventListener('click', () => div.remove());
      mappingsList.appendChild(div);
    }

    document.getElementById('addMapping').addEventListener('click', () => addColorMapping());

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        addColorMapping(btn.dataset.from, btn.dataset.to);
      });
    });

    // Tolerance slider
	function setTolerance(value) {
	  value = Math.max(1, Math.min(100, value)); // clamp

	  toleranceSlider.value = value;
	  toleranceNumber.value = value;
	  toleranceValue.textContent = value;
	}

	// Slider → others
	toleranceSlider.addEventListener('input', () => {
	  setTolerance(parseInt(toleranceSlider.value));
	});

	// Number → others
	toleranceNumber.addEventListener('input', () => {
	  setTolerance(parseInt(toleranceNumber.value || 1));
	});

	// − button
	tolMinus.addEventListener('click', () => {
	  setTolerance(parseInt(toleranceSlider.value) - 1);
	});

	// + button
	tolPlus.addEventListener('click', () => {
	  setTolerance(parseInt(toleranceSlider.value) + 1);
	});

    // Color conversion helpers
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }

    function colorDistance(r1, g1, b1, r2, g2, b2) {
      // Euclidean distance in RGB space
      return Math.sqrt(
        Math.pow(r1 - r2, 2) + 
        Math.pow(g1 - g2, 2) + 
        Math.pow(b1 - b2, 2)
      );
    }

    // Apply color swap
    document.getElementById('applyColors').addEventListener('click', () => {
      if (!originalImageData) {
        alert('Please upload an image first!');
        return;
      }

      // Gather all mappings
      const mappings = [];
      document.querySelectorAll('.mapping').forEach(div => {
        const fromHex = div.querySelector('.from-hex').value;
        const toHex = div.querySelector('.to-hex').value;
        const from = hexToRgb(fromHex);
        const to = hexToRgb(toHex);
        if (from && to) {
          mappings.push({ from, to });
        }
      });

      if (mappings.length === 0) {
        alert('Add at least one color mapping!');
        return;
      }

      const tolerance = parseInt(toleranceSlider.value);
      const maxDistance = tolerance * 4.41; // Scale to ~0-441 (max RGB distance)

      // Clone original data
      const imageData = new ImageData(
        new Uint8ClampedArray(originalImageData.data),
        originalImageData.width,
        originalImageData.height
      );
      const data = imageData.data;

      // Process each pixel
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // Check against each mapping
        for (const mapping of mappings) {
          const dist = colorDistance(r, g, b, mapping.from.r, mapping.from.g, mapping.from.b);
          if (dist <= maxDistance) {
            // Blend based on how close the match is
            const blend = 1 - (dist / maxDistance);
            data[i] = Math.round(r + (mapping.to.r - r) * blend);
            data[i + 1] = Math.round(g + (mapping.to.g - g) * blend);
            data[i + 2] = Math.round(b + (mapping.to.b - b) * blend);
            break; // First match wins
          }
        }
      }

      ctx.putImageData(imageData, 0, 0);
    });

    // Reset to original
    document.getElementById('resetImage').addEventListener('click', () => {
      if (originalImageData) {
        ctx.putImageData(originalImageData, 0, 0);
      }
    });

	    // Download result
	document.getElementById('downloadImage').addEventListener('click', () => {
	  if (!originalImageData) {
	    alert('No image to download!');
	    return;
	  }
	
	  // Save current canvas state
	  const tempImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

	  // Draw watermark
	  ctx.save();

	  ctx.font = "bold 48px system-ui";
	  ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
	  ctx.textAlign = "right";
	  ctx.textBaseline = "bottom";
	
	  ctx.fillText(
	    "ShrineBeasts Colour Swapper",
	    canvas.width - 20,
	    canvas.height - 20
	  );

	  ctx.restore();

	  // Export image
	  const link = document.createElement('a');
	  link.download = 'recolored-refsheet.png';
	  link.href = canvas.toDataURL('image/png');
	  link.click();

	  // Restore original image (remove watermark from UI)
	  ctx.putImageData(tempImageData, 0, 0);
	});



    // Add initial mapping
    addColorMapping();
  </script>
</body>
</html>
